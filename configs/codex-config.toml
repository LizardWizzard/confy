model = "glm-5.3"
model_provider = "ZAI"
forced_login_method = "api"
model_reasoning_effort = "high"
model_catalog_json = "~/.codex/models.json"

# --- permissions baseline (Claude-like: work in the workspace, ask at the boundary) ---
approval_policy = "on-request"
approvals_reviewer = "auto_review"
default_permissions = "dev"

[permissions.dev]
extends = ":workspace"

[permissions.dev.filesystem]
# workspace roots: edit anything, allow git to write its own index/refs,
# keep secret-bearing files unreadable.
":workspace_roots" = { "." = "write", ".git" = "write", "**/*.env" = "deny" }
glob_scan_max_depth = 3

[permissions.dev.network]
enabled = true

# Tokens live in the Secret Service keyring; codex fetches them by running
# token.sh (installed from configs/codex-token.sh) when a bearer token is
# needed. No secret is stored in this file or in the environment.
[model_providers.ZAI]
name = "ZAI"
base_url = "https://api.z.ai/api/v1"
wire_api = "responses"

[model_providers.ZAI.auth]
command = "/home/dr/.codex/token.sh"
args = ["zai", "codex"]
# Static API key: skip proactive refresh, re-run the command only on auth retry.
refresh_interval_ms = 0

[model_providers.deepseek]
name = "deepseek"
base_url = "https://api.aitunnel.ru/v1"
wire_api = "responses"

[model_providers.deepseek.auth]
command = "/home/dr/.codex/token.sh"
args = ["aitunnel", "codex"]
refresh_interval_ms = 0

[projects."/home/dr/wrk/picodata/picodata"]
trust_level = "trusted"

[projects."/home/dr/src/birchdb"]
trust_level = "trusted"

[projects."/home/dr/wrk/picodata/picodata-third"]
trust_level = "trusted"

[tui]
screen_reader_detection_done = true
status_line = ["model-with-reasoning", "current-dir", "thread-name", "git-branch", "pull-request-number", "approval-mode", "context-used", "five-hour-limit", "weekly-limit", "used-tokens", "thread-title"]
status_line_use_colors = true

[marketplaces.claude-plugins-official]
source_type = "git"
source = "https://github.com/anthropics/claude-plugins-official.git"

[marketplaces.revdiff]
source_type = "git"
source = "https://github.com/umputun/revdiff.git"

[plugins."pyright-lsp@claude-plugins-official"]
enabled = true

[plugins."rust-analyzer-lsp@claude-plugins-official"]
enabled = true

[plugins."revdiff@revdiff"]
enabled = true

[hooks.state]

[hooks.state."/home/dr/.codex/hooks.json:stop:0:0"]
trusted_hash = "sha256:488cf28a02fe22016d834cefeafc4af1b376bb70f154742867767b6065608c16"

[hooks.state."/home/dr/.codex/hooks.json:stop:0:1"]
trusted_hash = "sha256:488cf28a02fe22016d834cefeafc4af1b376bb70f154742867767b6065608c16"

[hooks.state."/home/dr/.codex/hooks.json:session_start:0:0"]
trusted_hash = "sha256:70f838d9a94b320ee49d738fc6b2206a29a691cad64b9175fcb8e4aa904748e9"

[features]
hooks = true

# Machine-local overrides (default model/provider, llama-swap, model catalogs,
# MCP servers) belong in ~/.codex/local.config.toml - never in this file.
